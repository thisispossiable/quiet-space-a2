<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title description">
  <title id="title">SafeBrowse system and control flow</title>
  <desc id="description">Authored scenario signals and a user-selected policy feed implemented deterministic rules. The interface shows allow, warning or block states. User controls include safe return, internal continuation or scripted review. Actions are logged in memory only. There is no live scanner or model API.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#50634d" stroke-width="1.5"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#253d2d}.heading{font-size:18px;font-weight:bold}.label{font-size:15px}.small{font-size:13px;fill:#54634e}.box{fill:#fff;stroke:#9cab8f;stroke-width:1.5}.flow{fill:none;stroke:#50634d;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1160" height="650" fill="#f5f4ee"/>
  <text x="40" y="46" font-size="27" font-weight="bold">SafeBrowse / from fixture to accountable decision</text>
  <text x="40" y="74" class="small">Solid borders: implemented components. Dashed borders: scripted evidence or outcomes, not external services.</text>
  <rect x="40" y="118" width="245" height="160" rx="10" class="box" stroke-dasharray="6 4"/>
  <text x="58" y="150" class="heading">Scenario fixtures</text>
  <text x="58" y="183" class="label">Known-risk / identity mismatch</text>
  <text x="58" y="210" class="label">Uncertain reputation / no flags</text>
  <text x="58" y="248" class="small">Reserved .example addresses only</text>
  <rect x="365" y="118" width="300" height="160" rx="10" class="box"/>
  <text x="383" y="150" class="heading">Policy rules [implemented]</text>
  <text x="383" y="183" class="label">N1: no flags → no warning</text>
  <text x="383" y="210" class="label">G1: flagged + guided → warn</text>
  <text x="383" y="237" class="label">P1: flagged + protective → block</text>
  <rect x="745" y="118" width="375" height="160" rx="10" class="box"/>
  <text x="763" y="150" class="heading">Decision view [implemented]</text>
  <text x="763" y="183" class="label">Visible state + reason disclosure</text>
  <text x="763" y="210" class="label">Safe return / optional understanding check</text>
  <text x="763" y="248" class="small">Guided continuation: internal preview only</text>
  <path d="M285 198 H365" class="flow"/>
  <path d="M665 198 H745" class="flow"/>
  <rect x="40" y="365" width="245" height="122" rx="10" class="box"/>
  <text x="58" y="398" class="heading">User controls</text>
  <text x="58" y="430" class="label">Select scenario + policy</text>
  <text x="58" y="458" class="label">Evaluate / reset / request review</text>
  <path d="M285 402 H330 V305 H515 V278" class="flow"/>
  <text x="365" y="326" class="small">Selected policy</text>
  <path d="M745 258 H705 V340 H162 V365" class="flow"/>
  <text x="415" y="360" class="small">Feedback informs the next action</text>
  <rect x="365" y="392" width="300" height="145" rx="10" class="box"/>
  <text x="383" y="425" class="heading">Memory trace</text>
  <text x="383" y="457" class="label">Scenario / policy / action / outcome</text>
  <text x="383" y="485" class="label">Optional local JSON export</text>
  <text x="383" y="514" class="small">Reset or reload clears state</text>
  <path d="M285 455 H365" class="flow"/>
  <rect x="745" y="365" width="375" height="172" rx="10" class="box" stroke-dasharray="6 4"/>
  <text x="763" y="398" class="heading">Review outcomes [scripted]</text>
  <text x="763" y="430" class="label">Request → pending → run fixed outcome</text>
  <text x="763" y="458" class="label">False positive → internal task restored</text>
  <text x="763" y="486" class="label">Risk flag retained → block upheld</text>
  <text x="763" y="514" class="small">No reviewer contacted; no live appeal service</text>
  <path d="M932 278 V365" class="flow"/>
  <text x="947" y="326" class="small">Review request</text>
  <path d="M745 478 H665" class="flow"/>
  <text x="40" y="592" class="label">Out of scope: live threat intelligence, browser integration, generative AI and real moderation.</text>
  <text x="40" y="618" class="small">Intelligent behaviour is represented by explainable rules over authored inputs; it is not a trained classifier.</text>
</svg>
